<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VGC Lab: Showdown games</title>
<style>
  :root { color-scheme: light dark; --ink:#1d1d1f; --sub:#6b6b70; --line:#d9d9de; --bg:#fff; --accent:#087F7C; --win:#1E8A55; --loss:#C93636; }
  @media (prefers-color-scheme: dark) { :root { --ink:#ececef; --sub:#9a9aa2; --line:#33333a; --bg:#18181b; --accent:#2CC6CB; --win:#4CB782; --loss:#EB5757; } }
  body { margin:0; width:320px; font:13.5px/1.4 system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
  header img { width:32px; height:32px; border-radius:6px; }
  header b { font-size:14.5px; }
  section { padding:10px 14px; border-bottom:1px solid var(--line); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:5px 0; }
  .sub { color:var(--sub); font-size:12px; }
  input[type=text] { width:100%; box-sizing:border-box; padding:5px 7px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--ink); font:12px ui-monospace, monospace; }
  .switch { position:relative; width:38px; height:22px; flex:none; }
  .switch input { opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; }
  .switch span { position:absolute; inset:0; border-radius:11px; background:var(--line); transition:background .15s; pointer-events:none; }
  .switch span::after { content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .15s; }
  .switch input:checked + span { background:var(--accent); }
  .switch input:checked + span::after { transform:translateX(16px); }
  .switch input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--sub); margin:2px 0 6px; }
  .game { display:flex; align-items:center; gap:8px; padding:5px 0; }
  .pill { font-weight:700; font-size:11px; padding:1px 6px; border-radius:4px; color:#fff; }
  .pill.W { background:var(--win); } .pill.L { background:var(--loss); }
  .game .who { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button { font:inherit; font-size:12px; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--accent); cursor:pointer; white-space:nowrap; }
  a { color:var(--accent); }
  footer { padding:9px 14px; }
</style>
</head>
<body>
<header><img src="icons/48.png" alt=""><div><b>VGC Lab: Showdown games</b><div class="sub" id="state">Loading…</div></div></header>
<section>
  <div class="row"><label for="enabled">Send my games to VGC Lab</label><span class="switch"><input type="checkbox" id="enabled"><span></span></span></div>
  <div class="row"><label for="lossesOnly">Losses only<div class="sub">Wins are skipped (you can still send one below)</div></label><span class="switch"><input type="checkbox" id="lossesOnly"><span></span></span></div>
  <div class="row"><label for="headsUp">Opponent heads-up<div class="sub">At team preview, what a player you've met before brought last time</div></label><span class="switch"><input type="checkbox" id="headsUp"><span></span></span></div>
  <div style="padding-top:6px"><label for="format" class="sub">Format (from the battle address on Showdown)</label><input type="text" id="format" spellcheck="false"></div>
</section>
<section>
  <h2>Recent games</h2>
  <div id="recent" class="sub">None yet. Finish a ladder game and it shows up here.</div>
</section>
<footer class="sub">Only rated ladder games you played in that format. Each game goes once. <a href="https://nramsay1212.github.io/vgc-lab/#log" target="_blank" rel="noopener">Open VGC Lab</a></footer>
<script src="popup.js"></script>
</body>
</html>
