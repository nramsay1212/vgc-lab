name: Test data scripts

# Only runs when something is pushed to the "probe" branch. Used to try the
# data scripts against the real websites without touching the live site.
on:
  push:
    branches: [probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          git clone --depth 1 https://github.com/smogon/pokemon-showdown.git /tmp/ps
          (cd /tmp/ps && npm install --no-audit --no-fund && node build)
          node scripts/build-data.js /tmp/ps data/dex.json
          node scripts/build-meta.js /tmp/ps data/dex.json data/meta.json
      - run: node scripts/build-sprites.js
      - run: node scripts/build-teams.js
      - run: NEWS_DEBUG=1 node scripts/build-news.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data && git commit -m "probe output" && git push || echo "nothing to save"
