name: Update data and publish

# Runs on every push, every Monday, and whenever you press "Run workflow"
# on the Actions tab. On the schedule and manual runs it first pulls the
# latest Pokémon data from Pokémon Showdown, so new games, regulations,
# Pokémon and items show up without anyone touching the code.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh Pokémon data from Showdown
        if: github.event_name != 'push'
        run: |
          git clone --depth 1 https://github.com/smogon/pokemon-showdown.git /tmp/ps
          (cd /tmp/ps && npm install --no-audit --no-fund && node build)
          node scripts/build-data.js /tmp/ps data/dex.json

      - name: Refresh usage stats from Smogon
        if: github.event_name != 'push'
        run: node scripts/build-meta.js /tmp/ps data/dex.json data/meta.json || echo "Usage stats not updated this time"

      - name: Update the damage calculator engine
        if: github.event_name != 'push'
        run: |
          latest=$(npm view @smogon/calc version)
          current=$(cat vendor/smogon-calc/VERSION 2>/dev/null || echo none)
          if [ "$latest" != "$current" ]; then
            mkdir -p /tmp/calcpkg && (cd /tmp/calcpkg && npm pack "@smogon/calc@$latest" >/dev/null && tar xzf smogon-calc-*.tgz)
            cp /tmp/calcpkg/package/dist/production.min.js vendor/smogon-calc/calc.min.js
            cp /tmp/calcpkg/package/dist/data/production.min.js vendor/smogon-calc/data.min.js
            echo "$latest" > vendor/smogon-calc/VERSION
            echo "Calculator updated from $current to $latest"
          else
            echo "Calculator already on $current"
          fi

      - name: Save new data
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain data vendor)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data vendor
            git commit -m "Weekly update: Pokémon data, usage stats and calculator"
            git push
          else
            echo "Nothing changed this week"
          fi

      - name: Stamp this version on the app's files
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s/\?v=[0-9a-z]+\"/?v=$v\"/g; s/App version [0-9a-z]+/App version $v/" index.html
          sed -i -E "s/const CACHE = 'vgclab-[^']+'/const CACHE = 'vgclab-$v'/" sw.js
          grep -o "app.js?v=[0-9a-z]*" index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
