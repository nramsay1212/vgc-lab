name: Update data and publish

# Runs on every push, every Monday, and whenever you press "Run workflow"
# on the Actions tab. On the schedule and manual runs it first pulls the
# latest Pokémon data from Pokémon Showdown, so new games, regulations,
# Pokémon and items show up without anyone touching the code.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh Pokémon data from Showdown
        if: github.event_name != 'push'
        run: |
          git clone --depth 1 https://github.com/smogon/pokemon-showdown.git /tmp/ps
          (cd /tmp/ps && npm install --no-audit --no-fund && node build)
          node scripts/build-data.js /tmp/ps data/dex.json

      - name: Save new data
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update Pokémon data from Showdown"
            git push
          else
            echo "Pokémon data unchanged"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
